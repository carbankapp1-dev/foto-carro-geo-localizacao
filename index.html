<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Câmera Geolocalizada</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1628">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CâmGeo">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<link rel="shortcut icon" href="favicon.ico">

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0a1628;
    color: #eef2f6;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    user-select: none;
  }
  header {
    width: 100%;
    padding: 16px 16px 12px;
    text-align: center;
    border-bottom: 1px solid #1b2e4a;
  }
  header h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  header p {
    margin: 4px 0 0;
    font-size: 12.5px;
    color: #7f93ad;
  }
  main {
    width: 100%;
    max-width: 480px;
    padding: 14px 16px calc(24px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .field-row {
    display: flex;
    gap: 10px;
  }
  .field {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .field label {
    font-size: 12px;
    color: #9db3cc;
    font-weight: 600;
  }
  .field input {
    background: #101f38;
    border: 1px solid #263c60;
    color: #eef2f6;
    border-radius: 9px;
    padding: 10px 11px;
    font-size: 15px;
    outline: none;
  }
  .field input:focus {
    border-color: #45d492;
  }
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 3/4;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #1b2e4a;
  }
  video, canvas, img.preview {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .hidden { display: none !important; }
  .status {
    font-size: 13px;
    color: #7f93ad;
    text-align: center;
    min-height: 18px;
  }
  .status.ok { color: #45d492; }
  .status.err { color: #ff7a7a; }
  .controls {
    display: flex;
    gap: 10px;
  }
  button {
    flex: 1;
    padding: 14px 10px;
    border-radius: 11px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: #45d492; color: #0a1628; }
  .btn-secondary { background: #16233b; color: #eef2f6; border: 1px solid #263c60; }
  button:active:not(:disabled) { opacity: 0.75; }
  .info-box {
    background: #101f38;
    border: 1px solid #1b2e4a;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: #b9c7db;
    line-height: 1.5;
  }
  .info-box strong { color: #eef2f6; }
  footer {
    padding: 6px 16px 18px;
    font-size: 11.5px;
    color: #4f6280;
    text-align: center;
  }
  #installBtn {
    display: none;
    background: #16233b;
    border: 1px solid #45d492;
    color: #45d492;
  }
</style>
</head>
<body>

<header>
  <h1>Câmera Geolocalizada</h1>
  <p>Marca a foto com código DN, loja, endereço e data/hora</p>
</header>

<main>
  <div class="field-row">
    <div class="field">
      <label for="inputDN">Código DN</label>
      <input id="inputDN" type="text" placeholder="Ex: DN-0231" autocomplete="off">
    </div>
    <div class="field">
      <label for="inputLoja">Nome da loja</label>
      <input id="inputLoja" type="text" placeholder="Ex: Loja Centro" autocomplete="off">
    </div>
  </div>

  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" class="hidden"></canvas>
    <img id="preview" class="preview hidden" alt="Foto capturada">
  </div>

  <div id="status" class="status">Ligando câmera…</div>

  <div class="controls">
    <button id="btnShoot" class="btn-primary" disabled>Tirar foto</button>
    <button id="btnRetry" class="btn-secondary hidden">Nova foto</button>
    <button id="btnDownload" class="btn-secondary hidden">Salvar foto</button>
  </div>

  <button id="installBtn">Instalar aplicativo</button>

  <div class="info-box" id="infoBox">
    Aguardando localização…
  </div>
</main>

<footer>Protótipo — funciona como app instalável (PWA), sem servidor</footer>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const preview = document.getElementById('preview');
const statusEl = document.getElementById('status');
const infoBox = document.getElementById('infoBox');
const btnShoot = document.getElementById('btnShoot');
const btnRetry = document.getElementById('btnRetry');
const btnDownload = document.getElementById('btnDownload');
const inputDN = document.getElementById('inputDN');
const inputLoja = document.getElementById('inputLoja');
const installBtn = document.getElementById('installBtn');

let stream = null;
let currentCoords = null;
let currentAddress = 'Endereço não disponível';
let logoImg = new Image();
let logoReady = false;
logoImg.onload = () => { logoReady = true; };
logoImg.src = 'icons/marca-dagua.png';

function setStatus(msg, kind) {
  statusEl.textContent = msg;
  statusEl.className = 'status' + (kind ? ' ' + kind : '');
}

// ---------- Câmera ----------
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' },
      audio: false
    });
    video.srcObject = stream;
    setStatus('Câmera pronta', 'ok');
    btnShoot.disabled = false;
  } catch (err) {
    setStatus('Não foi possível acessar a câmera: ' + err.message, 'err');
  }
}

// ---------- Geolocalização ----------
function startGeolocation() {
  if (!('geolocation' in navigator)) {
    infoBox.textContent = 'Geolocalização não suportada neste navegador.';
    return;
  }
  navigator.geolocation.getCurrentPosition(async (pos) => {
    currentCoords = {
      lat: pos.coords.latitude,
      lon: pos.coords.longitude,
      acc: pos.coords.accuracy
    };
    infoBox.innerHTML = '<strong>Coordenadas:</strong> ' +
      currentCoords.lat.toFixed(6) + ', ' + currentCoords.lon.toFixed(6) +
      '<br><strong>Endereço:</strong> buscando…';
    await fetchAddress(currentCoords.lat, currentCoords.lon);
  }, (err) => {
    infoBox.textContent = 'Erro ao obter localização: ' + err.message;
  }, {
    enableHighAccuracy: true,
    timeout: 15000,
    maximumAge: 0
  });
}

async function fetchAddress(lat, lon) {
  try {
    const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'pt-BR' } });
    const data = await res.json();
    currentAddress = data.display_name || 'Endereço não encontrado';
  } catch (err) {
    currentAddress = 'Endereço indisponível (falha na consulta)';
  }
  infoBox.innerHTML = '<strong>Coordenadas:</strong> ' +
    currentCoords.lat.toFixed(6) + ', ' + currentCoords.lon.toFixed(6) +
    '<br><strong>Endereço:</strong> ' + currentAddress;
}

// ---------- Captura + marca d'água ----------
function drawTiledWatermark(ctx, w, h) {
  if (!logoReady) return;
  const tileW = Math.max(60, w * 0.14);
  const scale = tileW / logoImg.width;
  const tileH = logoImg.height * scale;
  const gapX = tileW * 0.85;
  const gapY = tileH * 0.85;

  ctx.save();
  ctx.globalAlpha = 0.20;
  for (let y = -tileH; y < h + tileH; y += tileH + gapY) {
    for (let x = -tileW; x < w + tileW; x += tileW + gapX) {
      ctx.drawImage(logoImg, x, y, tileW, tileH);
    }
  }
  ctx.restore();
}

function drawInfoOverlay(ctx, w, h) {
  const now = new Date();
  const dateStr = now.toLocaleDateString('pt-BR') + ' ' + now.toLocaleTimeString('pt-BR');
  const coordStr = currentCoords
    ? `${currentCoords.lat.toFixed(6)}, ${currentCoords.lon.toFixed(6)}`
    : 'Coordenadas não disponíveis';

  const dn = inputDN.value.trim();
  const loja = inputLoja.value.trim();

  const lines = [];
  if (dn || loja) {
    const parts = [];
    if (dn) parts.push('DN: ' + dn);
    if (loja) parts.push('Loja: ' + loja);
    lines.push(parts.join('   •   '));
  }
  lines.push(dateStr);
  lines.push(coordStr);
  lines.push('Endereço: ' + currentAddress);

  const pad = w * 0.03;
  const fontSize = Math.max(13, w * 0.032);
  ctx.font = `${fontSize}px -apple-system, Arial, sans-serif`;
  ctx.textBaseline = 'bottom';

  const maxWidth = w - pad * 2;
  function wrapLine(text) {
    const words = text.split(' ');
    const out = [];
    let line = '';
    for (const word of words) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        out.push(line);
        line = word;
      } else {
        line = test;
      }
    }
    if (line) out.push(line);
    return out;
  }

  let allLines = [];
  lines.forEach((l) => { allLines = allLines.concat(wrapLine(l)); });

  const lh = fontSize * 1.35;
  const boxHeight = allLines.length * lh + pad * 1.4;

  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0, h - boxHeight, w, boxHeight);

  ctx.fillStyle = '#ffffff';
  let ty = h - pad * 0.6;
  for (let i = allLines.length - 1; i >= 0; i--) {
    ctx.fillText(allLines[i], pad, ty);
    ty -= lh;
  }
}

function capturePhoto() {
  const w = video.videoWidth;
  const h = video.videoHeight;
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');

  ctx.drawImage(video, 0, 0, w, h);
  drawTiledWatermark(ctx, w, h);
  drawInfoOverlay(ctx, w, h);

  preview.src = canvas.toDataURL('image/jpeg', 0.92);
  preview.classList.remove('hidden');
  video.classList.add('hidden');
  btnShoot.classList.add('hidden');
  btnRetry.classList.remove('hidden');
  btnDownload.classList.remove('hidden');
}

function resetToCamera() {
  preview.classList.add('hidden');
  video.classList.remove('hidden');
  btnShoot.classList.remove('hidden');
  btnRetry.classList.add('hidden');
  btnDownload.classList.add('hidden');
}

btnShoot.addEventListener('click', capturePhoto);
btnRetry.addEventListener('click', resetToCamera);
btnDownload.addEventListener('click', () => {
  const link = document.createElement('a');
  const ts = new Date().toISOString().replace(/[:.]/g, '-');
  const dn = inputDN.value.trim().replace(/\s+/g, '-') || 'sem-dn';
  link.download = `foto-${dn}-${ts}.jpg`;
  link.href = canvas.toDataURL('image/jpeg', 0.92);
  link.click();
});

startCamera();
startGeolocation();

// ---------- PWA: registro do service worker ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// ---------- PWA: prompt de instalação (Android/Chrome) ----------
let deferredInstallEvent = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallEvent = e;
  installBtn.style.display = 'block';
});
installBtn.addEventListener('click', async () => {
  if (!deferredInstallEvent) return;
  deferredInstallEvent.prompt();
  await deferredInstallEvent.userChoice;
  deferredInstallEvent = null;
  installBtn.style.display = 'none';
});
window.addEventListener('appinstalled', () => {
  installBtn.style.display = 'none';
});
</script>

</body>
</html>
