<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Câmera Geolocalizada</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1628">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CâmGeo">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<link rel="shortcut icon" href="favicon.ico">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>

<!-- Gerador de QR Code -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0a1628;
    color: #eef2f6;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    user-select: none;
  }
  main {
    width: 100%;
    max-width: 480px;
    padding: calc(10px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .field-row {
    display: flex;
    gap: 10px;
  }
  .field {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }
  .field.field-dn {
    flex: 0 0 92px;
  }
  .field label {
    font-size: 12px;
    color: #9db3cc;
    font-weight: 600;
  }
  .field input {
    background: #101f38;
    border: 1px solid #263c60;
    color: #eef2f6;
    border-radius: 9px;
    padding: 10px 11px;
    font-size: 15px;
    outline: none;
    width: 100%;
    min-width: 0;
  }
  .field-dn input {
    text-align: center;
    padding: 10px 6px;
  }
  .field input:focus {
    border-color: #45d492;
  }
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3.3;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #1b2e4a;
  }
  video, canvas, img.preview {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .hidden { display: none !important; }
  .status {
    font-size: 13px;
    color: #7f93ad;
    text-align: center;
    min-height: 18px;
  }
  .status.ok { color: #45d492; }
  .status.err { color: #ff7a7a; }
  .controls {
    display: flex;
    gap: 10px;
  }
  button {
    flex: 1;
    padding: 14px 10px;
    border-radius: 11px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: #45d492; color: #0a1628; }
  .btn-secondary { background: #16233b; color: #eef2f6; border: 1px solid #263c60; }
  button:active:not(:disabled) { opacity: 0.75; }
  .info-box {
    background: #101f38;
    border: 1px solid #1b2e4a;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: #b9c7db;
    line-height: 1.5;
  }
  .info-box strong { color: #eef2f6; }
  footer {
    padding: 6px 16px 18px;
    font-size: 11.5px;
    color: #4f6280;
    text-align: center;
  }
  #installBtn {
    display: none;
    background: #16233b;
    border: 1px solid #45d492;
    color: #45d492;
  }
  #btnUpload:disabled, #btnDownload:disabled {
    opacity: 0.5;
  }
</style>
</head>
<body>

<main>
  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" class="hidden"></canvas>
    <img id="preview" class="preview hidden" alt="Foto capturada">
  </div>

  <div class="field-row">
    <div class="field field-dn">
      <label for="inputDN">Código DN</label>
      <input id="inputDN" type="text" inputmode="numeric" maxlength="5" placeholder="60411" autocomplete="off">
    </div>
    <div class="field">
      <label for="inputLoja">Nome da loja</label>
      <input id="inputLoja" type="text" placeholder="Ex: Loja Centro" autocomplete="off">
    </div>
  </div>

  <div class="field-row">
    <div class="field">
      <label for="inputCPF">CPF do responsável</label>
      <input id="inputCPF" type="text" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off">
    </div>
    <div class="field">
      <label for="inputResp">Nome do responsável</label>
      <input id="inputResp" type="text" placeholder="Ex: João da Silva" autocomplete="off">
    </div>
  </div>

  <div id="status" class="status">Ligando câmera…</div>

  <div class="controls">
    <button id="btnShoot" class="btn-primary" disabled>Tirar foto</button>
    <button id="btnRetry" class="btn-secondary hidden">Nova foto</button>
  </div>

  <div class="controls">
    <button id="btnUpload" class="btn-primary hidden">Enviar e gerar QR Code</button>
    <button id="btnDownload" class="btn-secondary hidden" disabled>Salvar foto validada</button>
  </div>

  <div id="uploadStatus" class="status hidden"></div>

  <div id="qrHolder" style="display:none;"></div>

  <button id="installBtn">Instalar aplicativo</button>

  <div class="info-box" id="infoBox">
    Aguardando localização…
  </div>
</main>

<footer>Protótipo — funciona como app instalável (PWA), sem servidor</footer>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const preview = document.getElementById('preview');
const statusEl = document.getElementById('status');
const infoBox = document.getElementById('infoBox');
const btnShoot = document.getElementById('btnShoot');
const btnRetry = document.getElementById('btnRetry');
const btnUpload = document.getElementById('btnUpload');
const btnDownload = document.getElementById('btnDownload');
const uploadStatus = document.getElementById('uploadStatus');
const inputDN = document.getElementById('inputDN');
const inputLoja = document.getElementById('inputLoja');
const inputCPF = document.getElementById('inputCPF');
const inputResp = document.getElementById('inputResp');
const installBtn = document.getElementById('installBtn');
const qrHolder = document.getElementById('qrHolder');

let stream = null;
let currentCoords = null;
let currentAddress = 'Endereço não disponível';
let logoImg = new Image();
let logoReady = false;
logoImg.onload = () => { logoReady = true; };
logoImg.src = 'icons/marca-dagua.png';

function setStatus(msg, kind) {
  statusEl.textContent = msg;
  statusEl.className = 'status' + (kind ? ' ' + kind : '');
}
function setUploadStatus(msg, kind) {
  uploadStatus.textContent = msg;
  uploadStatus.className = 'status' + (kind ? ' ' + kind : '');
  uploadStatus.classList.remove('hidden');
}

// ---------- Máscara e validação de CPF ----------
inputCPF.addEventListener('input', () => {
  let v = inputCPF.value.replace(/\D/g, '').slice(0, 11);
  if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
  else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
  else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
  inputCPF.value = v;
});

function isValidCPF(cpf) {
  cpf = (cpf || '').replace(/\D/g, '');
  if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
  let sum = 0;
  for (let i = 0; i < 9; i++) sum += parseInt(cpf[i]) * (10 - i);
  let rev = 11 - (sum % 11);
  if (rev >= 10) rev = 0;
  if (rev !== parseInt(cpf[9])) return false;
  sum = 0;
  for (let i = 0; i < 10; i++) sum += parseInt(cpf[i]) * (11 - i);
  rev = 11 - (sum % 11);
  if (rev >= 10) rev = 0;
  return rev === parseInt(cpf[10]);
}

// ---------- Câmera ----------
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' },
      audio: false
    });
    video.srcObject = stream;
    setStatus('Câmera pronta', 'ok');
    btnShoot.disabled = false;
  } catch (err) {
    setStatus('Não foi possível acessar a câmera: ' + err.message, 'err');
  }
}

// ---------- Geolocalização ----------
function startGeolocation() {
  if (!('geolocation' in navigator)) {
    infoBox.textContent = 'Geolocalização não suportada neste navegador.';
    return;
  }
  navigator.geolocation.getCurrentPosition(async (pos) => {
    currentCoords = {
      lat: pos.coords.latitude,
      lon: pos.coords.longitude,
      acc: pos.coords.accuracy
    };
    infoBox.innerHTML = '<strong>Coordenadas:</strong> ' +
      currentCoords.lat.toFixed(6) + ', ' + currentCoords.lon.toFixed(6) +
      '<br><strong>Endereço:</strong> buscando…';
    await fetchAddress(currentCoords.lat, currentCoords.lon);
  }, (err) => {
    infoBox.textContent = 'Erro ao obter localização: ' + err.message;
  }, {
    enableHighAccuracy: true,
    timeout: 15000,
    maximumAge: 0
  });
}

async function fetchAddress(lat, lon) {
  try {
    const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'pt-BR' } });
    const data = await res.json();
    currentAddress = data.display_name || 'Endereço não encontrado';
  } catch (err) {
    currentAddress = 'Endereço indisponível (falha na consulta)';
  }
  infoBox.innerHTML = '<strong>Coordenadas:</strong> ' +
    currentCoords.lat.toFixed(6) + ', ' + currentCoords.lon.toFixed(6) +
    '<br><strong>Endereço:</strong> ' + currentAddress;
}

// ---------- Captura + marca d'água ----------
function drawTiledWatermark(ctx, w, h) {
  if (!logoReady) return;
  const tileW = Math.max(60, w * 0.14);
  const scale = tileW / logoImg.width;
  const tileH = logoImg.height * scale;
  const gapX = tileW * 0.85;
  const gapY = tileH * 0.85;

  ctx.save();
  ctx.globalAlpha = 0.20;
  for (let y = -tileH; y < h + tileH; y += tileH + gapY) {
    for (let x = -tileW; x < w + tileW; x += tileW + gapX) {
      ctx.drawImage(logoImg, x, y, tileW, tileH);
    }
  }
  ctx.restore();
}

// Reserva espaço à direita para o QR Code quando reservedRight > 0
function drawInfoOverlay(ctx, w, h, reservedRight) {
  reservedRight = reservedRight || 0;
  const now = new Date();
  const dateStr = now.toLocaleDateString('pt-BR') + ' ' + now.toLocaleTimeString('pt-BR');
  const coordStr = currentCoords
    ? `${currentCoords.lat.toFixed(6)}, ${currentCoords.lon.toFixed(6)}`
    : 'Coordenadas não disponíveis';

  const dn = inputDN.value.trim();
  const loja = inputLoja.value.trim();

  const lines = [];
  if (dn || loja) {
    const parts = [];
    if (dn) parts.push('DN: ' + dn);
    if (loja) parts.push('Loja: ' + loja);
    lines.push(parts.join('   •   '));
  }
  lines.push(dateStr);
  lines.push(coordStr);
  lines.push('Endereço: ' + currentAddress);

  const pad = w * 0.03;
  const fontSize = Math.max(13, w * 0.032);
  ctx.font = `${fontSize}px -apple-system, Arial, sans-serif`;
  ctx.textBaseline = 'bottom';

  const maxWidth = w - pad * 2 - reservedRight;
  function wrapLine(text) {
    const words = text.split(' ');
    const out = [];
    let line = '';
    for (const word of words) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        out.push(line);
        line = word;
      } else {
        line = test;
      }
    }
    if (line) out.push(line);
    return out;
  }

  let allLines = [];
  lines.forEach((l) => { allLines = allLines.concat(wrapLine(l)); });

  const lh = fontSize * 1.35;
  const boxHeight = Math.max(allLines.length * lh + pad * 1.4, reservedRight > 0 ? reservedRight / 0.78 : 0);

  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0, h - boxHeight, w, boxHeight);

  ctx.fillStyle = '#ffffff';
  let ty = h - pad * 0.6;
  for (let i = allLines.length - 1; i >= 0; i--) {
    ctx.fillText(allLines[i], pad, ty);
    ty -= lh;
  }

  return boxHeight;
}

let rawFrameCanvas = document.createElement('canvas');

function capturePhoto() {
  const w = video.videoWidth;
  const h = video.videoHeight;
  canvas.width = w;
  canvas.height = h;
  rawFrameCanvas.width = w;
  rawFrameCanvas.height = h;

  // Guarda o frame cru (sem marca d'água/texto) para poder redesenhar
  // do zero na hora do envio, sem duplicar as camadas
  rawFrameCanvas.getContext('2d').drawImage(video, 0, 0, w, h);

  const ctx = canvas.getContext('2d');
  ctx.drawImage(rawFrameCanvas, 0, 0, w, h);
  drawTiledWatermark(ctx, w, h);
  drawInfoOverlay(ctx, w, h, 0);

  preview.src = canvas.toDataURL('image/jpeg', 0.92);
  preview.classList.remove('hidden');
  video.classList.add('hidden');
  btnShoot.classList.add('hidden');
  btnRetry.classList.remove('hidden');
  btnUpload.classList.remove('hidden');
  btnDownload.classList.add('hidden');
  uploadStatus.classList.add('hidden');
}

function resetToCamera() {
  preview.classList.add('hidden');
  video.classList.remove('hidden');
  btnShoot.classList.remove('hidden');
  btnRetry.classList.add('hidden');
  btnUpload.classList.add('hidden');
  btnUpload.disabled = false;
  btnDownload.classList.add('hidden');
  uploadStatus.classList.add('hidden');
}

// ---------- Gerar QR Code e desenhar no canvas ----------
async function drawQrOnCanvas(ctx, w, h, verifyUrl, boxHeight) {
  qrHolder.innerHTML = '';
  const qrSize = Math.round(Math.min(w * 0.24, boxHeight * 0.78));

  await new Promise((resolve) => {
    new QRCode(qrHolder, {
      text: verifyUrl,
      width: qrSize,
      height: qrSize,
      correctLevel: QRCode.CorrectLevel.M
    });
    setTimeout(resolve, 120); // dá tempo da lib renderizar
  });

  const qrCanvas = qrHolder.querySelector('canvas');
  const qrImgEl = qrHolder.querySelector('img');
  const pad = w * 0.03;
  const boxX = w - qrSize - pad * 1.6;
  const boxY = h - boxHeight + (boxHeight - qrSize) / 2 - pad * 0.2;

  // fundo branco atrás do QR para garantir leitura
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(boxX - 6, boxY - 6, qrSize + 12, qrSize + 12);

  if (qrCanvas) {
    ctx.drawImage(qrCanvas, boxX, boxY, qrSize, qrSize);
  } else if (qrImgEl) {
    ctx.drawImage(qrImgEl, boxX, boxY, qrSize, qrSize);
  }
}

// ---------- Compressão para caber no limite de 1 MB do Firestore ----------
async function compressToFit(sourceCanvas, maxBase64Len) {
  let quality = 0.82;
  let scale = 1;

  for (let attempt = 0; attempt < 9; attempt++) {
    const w = Math.max(1, Math.round(sourceCanvas.width * scale));
    const h = Math.max(1, Math.round(sourceCanvas.height * scale));

    let workCanvas = sourceCanvas;
    if (scale < 1) {
      workCanvas = document.createElement('canvas');
      workCanvas.width = w;
      workCanvas.height = h;
      workCanvas.getContext('2d').drawImage(sourceCanvas, 0, 0, w, h);
    }

    const dataUrl = workCanvas.toDataURL('image/jpeg', quality);
    const base64 = dataUrl.split(',')[1];

    if (base64.length <= maxBase64Len || attempt === 8) {
      return { dataUrl, base64, width: w, height: h, quality };
    }

    if (quality > 0.45) {
      quality -= 0.12;
    } else {
      scale *= 0.8;
    }
  }
}

async function sha256FromDataUrl(dataUrl) {
  const res = await fetch(dataUrl);
  const buf = await res.arrayBuffer();
  const hashBuf = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ---------- Envio para o Firebase + geração do QR ----------
async function uploadAndValidate() {
  const cpf = inputCPF.value.trim();
  const responsavel = inputResp.value.trim();

  if (!responsavel) {
    setUploadStatus('Preencha o nome do responsável antes de enviar.', 'err');
    return;
  }
  if (!isValidCPF(cpf)) {
    setUploadStatus('CPF inválido. Confira os números digitados.', 'err');
    return;
  }

  btnUpload.disabled = true;
  setUploadStatus('Autenticando…');

  try {
    await ensureAuth();

    const id = (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
    const verifyUrl = `${VERIFY_BASE_URL}?id=${id}`;

    setUploadStatus('Gerando QR Code…');
    const w = canvas.width, h = canvas.height;
    const ctx = canvas.getContext('2d');

    // Redesenha do zero a partir do frame cru — evita duplicar
    // a marca d'água/texto que já tinha sido desenhada na prévia
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(rawFrameCanvas, 0, 0, w, h);
    drawTiledWatermark(ctx, w, h);
    const boxHeight = drawInfoOverlay(ctx, w, h, w * 0.28);
    await drawQrOnCanvas(ctx, w, h, verifyUrl, boxHeight);

    // Versão em alta qualidade fica só no aparelho (botão "Salvar foto validada")
    preview.src = canvas.toDataURL('image/jpeg', 0.92);

    setUploadStatus('Compactando foto para o banco de dados…');
    const compressed = await compressToFit(canvas, MAX_FOTO_BASE64_LEN);
    const imageHash = await sha256FromDataUrl(compressed.dataUrl);

    setUploadStatus('Gravando registro…');
    const createdAt = firebase.firestore.FieldValue.serverTimestamp();

    await db.collection('fotos').doc(id).set({
      createdAt,
      dn: inputDN.value.trim(),
      loja: inputLoja.value.trim(),
      responsavel,
      lat: currentCoords ? currentCoords.lat : null,
      lon: currentCoords ? currentCoords.lon : null,
      address: currentAddress,
      imageHash,
      foto: compressed.base64,
      mimeType: 'image/jpeg'
    });

    await db.collection('fotos_privado').doc(id).set({
      cpf,
      responsavel,
      createdAt
    });

    setUploadStatus('Validado com sucesso ✔ — ID ' + id, 'ok');
    btnUpload.classList.add('hidden');
    btnDownload.classList.remove('hidden');
    btnDownload.disabled = false;
  } catch (err) {
    setUploadStatus('Erro ao enviar: ' + err.message, 'err');
    btnUpload.disabled = false;
  }
}

btnShoot.addEventListener('click', capturePhoto);
btnRetry.addEventListener('click', resetToCamera);
btnUpload.addEventListener('click', uploadAndValidate);
btnDownload.addEventListener('click', () => {
  const link = document.createElement('a');
  const ts = new Date().toISOString().replace(/[:.]/g, '-');
  const dn = inputDN.value.trim().replace(/\s+/g, '-') || 'sem-dn';
  link.download = `foto-${dn}-${ts}.jpg`;
  link.href = canvas.toDataURL('image/jpeg', 0.92);
  link.click();

  // Limpa os campos e volta pra câmera, pronta para a próxima foto
  inputDN.value = '';
  inputLoja.value = '';
  inputCPF.value = '';
  inputResp.value = '';
  resetToCamera();
});

startCamera();
startGeolocation();

// ---------- PWA: registro do service worker ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// ---------- PWA: prompt de instalação (Android/Chrome) ----------
let deferredInstallEvent = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallEvent = e;
  installBtn.style.display = 'block';
});
installBtn.addEventListener('click', async () => {
  if (!deferredInstallEvent) return;
  deferredInstallEvent.prompt();
  await deferredInstallEvent.userChoice;
  deferredInstallEvent = null;
  installBtn.style.display = 'none';
});
window.addEventListener('appinstalled', () => {
  installBtn.style.display = 'none';
});
</script>

</body>
</html>
